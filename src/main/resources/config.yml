# Obtain a key here: https://platform.openai.com
openai-key: ""

# The model to use. Must support tool/function calling.
openai-model: "gpt-4o-mini"

# The base URL of the OpenAI-compatible API to use. Change this to point at
# Azure OpenAI, OpenRouter, a self-hosted model server (Ollama, LM Studio,
# vLLM, etc.), or any other API compatible with OpenAI's chat completions
# endpoint.
openai-base-url: "https://api.openai.com/v1"

# Only applies to reasoning models (e.g., o-series, gpt-5 family). One of
# "minimal", "low", "medium", or "high". Leave blank to omit it, which is
# required for non-reasoning models.
openai-reasoning-effort: ""

# Log conversation messages to server console, useful for catching abuse
log-conversations: true

# Personalities a villager may be randomly assigned when a conversation with them starts. Each
# villager keeps the same personality across conversations. Add, remove, or edit entries as you like.
personalities:
  - name: "Elder"
    description: "As an elder of the village, you have seen and done many things across the years"
  - name: "Optimist"
    description: "You are an optimist that always tries to look on the bright side of things"
  - name: "Grumpy"
    description: "You are a grump that isn't afraid to speak his mind"
  - name: "Barterer"
    description: "You are a shrewd trader that has much experience in bartering"
  - name: "Jester"
    description: "You enjoy telling funny jokes and are generally playful toward players"
  - name: "Serious"
    description: "You are serious, diplomatic, and to-the-point. A businessperson at heart, you do not have much patience for small talk"
  - name: "Empath"
    description: "You are a kind person and very empathetic to others' situations"